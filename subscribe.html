<main>
  <!-- In <body> -->
    <div>
        <h1>Subscribe</h1>
        <p>Subsribe for biweekly newsletters by Alyxandria Klein and mailed collection progress news. If you subsribe here from January 1 - March 31, get surprise gift mailed to you!</p>
    </div>
    <form action="PASTE-URL-FROM-EMAIL-SERVICE" method="post" class="row g-3">

        <div class="col-md-6">
          <label for="firstName" class="form-label">First name</label>
          <input type="text" class="form-control" id="firstName" name="first_name" autocomplete="given-name" required>
        </div>
      
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last name</label>
          <input type="text" class="form-control" id="lastName" name="last_name" autocomplete="family-name" required>
        </div>
      
        <div class="col-12">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>
      
        <div class="col-12">
          <label for="address1" class="form-label">Address</label>
          <input type="text" class="form-control" id="address1" name="address1" autocomplete="address-line1">
        </div>
      
        <div class="col-12">
          <label for="address2" class="form-label">Apartment, suite, etc.</label>
          <input type="text" class="form-control" id="address2" name="address2" autocomplete="address-line2">
        </div>
      
        <div class="col-md-6">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" id="city" name="city" autocomplete="address-level2">
        </div>
      
        <div class="col-md-3">
          <label for="state" class="form-label">State</label>
          <input type="text" class="form-control" id="state" name="state" autocomplete="address-level1">
        </div>
      
        <div class="col-md-3">
          <label for="zip" class="form-label">ZIP code</label>
          <input type="text" class="form-control" id="zip" name="zip" autocomplete="postal-code">
        </div>
      
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Subscribe</button>
        </div>
      
      </form>

</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
